[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis_career"
version = "0.1.0"
description = "Get a tennis player's career matches from Tennis Abstract and plot them by age"
readme = "README.md"
authors = [{ name = "Miranda Zhu" }]
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib>=3.5", "requests"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
